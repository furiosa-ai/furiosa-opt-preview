[package]
name = "furiosa-opt-abi"
version = "0.9.0+g8bcbd9fd"
edition = "2024"
license = "Apache-2.0"
description = "ABI contracts shared by the Furiosa Opt host and device runtimes."

[features]
default = ["alloc"]
alloc = []
bincode = ["dep:bincode2"]
serde = ["dep:serde"]

[dependencies]
bincode2 = { workspace = true, optional = true }
serde = { version = "1.0.175", default-features = false, features = ["derive"], optional = true }
thiserror-core = { workspace = true }
zerocopy = { version = "0.8", default-features = false, features = ["derive"] }

[lints]
workspace = true
