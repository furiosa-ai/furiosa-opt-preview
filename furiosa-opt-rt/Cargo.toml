[package]
name = "furiosa-opt-rt"
version = "0.9.0+gcd514c9c"
edition = "2024"
license = "Apache-2.0"
description = "Host runtime for executing Furiosa Opt device functions on Furiosa NPUs."
include = ["Cargo.toml", "README.md", "build.rs", "src/", "prebuilt/"]

[dependencies]
arrayvec = { workspace = true }
bincode = { workspace = true }
bytemuck = { workspace = true }
dma-heap = "0.4"
furiosa-opt-abi = { path = "../furiosa-opt-abi", version = "0.9.0", features = ["serde"] }
furiosa-opt-ipc = { path = "ipc", version = "0.9.0" }
io-uring = { workspace = true }
log = { workspace = true }
memmap2 = "0.9"
nix = { workspace = true, features = ["fs", "ioctl", "mman"] }
serde = { workspace = true }
smallvec = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
