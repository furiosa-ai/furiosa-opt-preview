[package]
name = "furiosa-opt-ipc"
version = "0.9.0+g23b9e1ba"
edition = "2024"
license = "Apache-2.0"
description = "IPC protocol for communication between the Furiosa Opt host runtime and firmware."
publish = { workspace = true }

[features]
default = ["std"]
std = []

[dependencies]
bincode2 = { workspace = true }
bytemuck = { workspace = true }
furiosa-opt-abi = { workspace = true, features = ["bincode"] }
thiserror-core = { workspace = true }

[lints]
workspace = true
